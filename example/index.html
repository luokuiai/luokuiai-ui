<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUOKUI UI · 组件预览</title>
  <link rel="stylesheet" href="/example.css">
  <style>body{margin:0} #root .lk-shell{min-height:100vh} .toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap} .toolbar h1{margin:0;font-size:1.25rem} .side{display:grid;justify-items:start;gap:12px} .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:var(--lk-space)} .metric{font-size:2rem;font-weight:600;margin:0}</style>
</head>
